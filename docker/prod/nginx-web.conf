# motion-web: the built SPA, nothing else. The API lives on the same hostname but a
# different route (see the HTTPRoute), so this server block never proxies anything --
# which is why it can be this short and this boring.
server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Vite writes content-hashed filenames, so these can be cached hard and forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Deep links (/events/<id>, opened from a notification) must reach the SPA rather than
    # 404 on a path that only exists client-side. index.html itself is never cached, or a
    # deploy would be invisible until someone cleared their browser.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Android App Links. Without this a tapped notification opens the browser instead of
    # the app (HANDOFF H6). Served as JSON whatever the file extension suggests.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
