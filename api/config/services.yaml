# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $public_recordings_folder: '%env(resolve:PUBLIC_RECORDINGS_FOLDER)%'
            string $public_folder: '%env(resolve:PUBLIC_FOLDER)%'
            string $private_recordings_folder: '%env(resolve:PRIVATE_UNPROCESSED_RECORDINGS_FOLDER)%'
            int $max_disk_usage_size_gb: '%env(int:MAX_DISK_SIZE_USAGE_GB)%'
            string $raspberry_base_url: '%env(resolve:RASPBERRY_BASE_URL)%'
            # event-bridge auth (InternalEventController) -- see docs/v2/07-api-and-data-model.md#internal
            string $bridge_secret: '%env(resolve:BRIDGE_SECRET)%'
            # MediaTokenService -- see docs/v2/07-api-and-data-model.md#media-tokens
            string $signing_key: '%env(resolve:MEDIA_SIGNING_KEY)%'
            # FrigateClient. In-cluster Service name; Frigate has no route out of the
            # cluster and is not supposed to get one.
            string $frigate_base_url: '%env(resolve:FRIGATE_BASE_URL)%'
            # The LAN address of go2rtc for the WebRTC rung, which cannot traverse the
            # Cloudflare Tunnel (adr/0004). Empty means "do not offer that rung at all",
            # which is better than offering one that always times out.
            string $webrtc_lan_url: '%env(resolve:WEBRTC_LAN_URL)%'
            # Padding either side of an event clip. Keep these at or below Frigate's
            # record.*.pre_capture/post_capture, or you ask for recording segments that
            # retention has already deleted and get a short clip back with no error.
            int $clip_pre_roll_s: '%env(int:MEDIA_CLIP_PRE_ROLL_S)%'
            int $clip_post_roll_s: '%env(int:MEDIA_CLIP_POST_ROLL_S)%'

            # Automatically inject the conversion logger into any service requiring it
#            LoggerInterface $conversion_logger: '@monolog.logger.conversion_logger'  # Bind conversion_logger

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\MessageHandler\ProcessFileMessageHandler:
        arguments:
            $conversion_logger: '@monolog.logger.conversion_logger'

    App\Service\RequestResponseLogger:
        arguments:
            $request_response_logger: '@monolog.logger.request_response_logger'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest }
            - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse }