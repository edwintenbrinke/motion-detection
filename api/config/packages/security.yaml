# config/packages/security.yaml
security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username
        # used to reload user from session & other features (e.g. switch_user)

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        
        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login
                success_handler: App\Security\JwtCookieAuthenticationSuccessHandler
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        refresh:
            pattern: ^/api/token/refresh
            stateless: true
            custom_authenticators:
                - App\Security\RefreshTokenAuthenticator

        logout:
            pattern: ^/api/logout
            stateless: true
            security: false  # Disable authentication for this path

        api:
            pattern: ^/api
            stateless: true
            custom_authenticators:
                - App\Security\JwtCookieOrHeaderAuthenticator
#            jwt:
#                authenticator: App\Security\JwtCookieOrHeaderAuthenticator

    access_control:
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/logout, roles: PUBLIC_ACCESS }
        # event-bridge has no user session and sends no JWT -- it authenticates with the
        # X-Bridge-Secret header instead, checked inside InternalEventController itself.
        # PUBLIC_ACCESS here only means "the firewall doesn't require a JWT"; it is NOT
        # equivalent to unauthenticated -- do not add another route under this prefix
        # without the same explicit secret check. See docs/v2/07-api-and-data-model.md#internal.
        - { path: ^/api/internal, roles: PUBLIC_ACCESS }
        # Signed media URLs are their own credential: <img>, <video> and Android's
        # notification-image fetcher cannot send an Authorization header, so the HMAC in
        # the query string is what authenticates them. MediaController verifies every one
        # of these before returning a single byte -- PUBLIC_ACCESS here means "no JWT
        # required", not "unauthenticated". Do not add a route under /api/media that does
        # not call MediaTokenService::verify(). See docs/v2/07-api-and-data-model.md#media-tokens.
        - { path: ^/api/media, roles: PUBLIC_ACCESS }
        # Same bargain as /api/media, for the same reason: an HLS playlist references its
        # segments relatively, so those requests arrive with no header and no signature.
        # TimelineMediaController checks a signature or a session on every route under here.
        - { path: ^/api/timeline, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }